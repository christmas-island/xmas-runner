# =============================================================================
# xmas-runner — docker-compose for local deployment
# =============================================================================
# Usage:
#   cp .env.example .env   # Fill in your values
#   docker compose up -d
# =============================================================================

services:
  runner:
    image: ghcr.io/christmas-island/xmas-runner:latest
    # Uncomment to build locally instead of pulling from GHCR:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    # Required on Apple Silicon (M1/M2/M3/M4) to match CI x86_64 environment.
    # Without this, the runner registers as arm64 and won't pick up x64 jobs.
    platform: linux/amd64

    # Fix Docker socket permissions on Docker Desktop for Mac.
    # Docker Desktop creates the socket as root:root, so the runner can't access
    # it without a chmod. This overrides the default entrypoint to apply the fix
    # before handing off to the real runner entrypoint.
    entrypoint: ["/bin/bash", "-c", "sudo chmod 666 /var/run/docker.sock && exec /home/runner/entrypoint.sh"]

    # Required for the entrypoint chmod to work on Docker Desktop Mac
    privileged: true

    environment:
      # --- Authentication (choose ONE method) ---

      # Method 1: Direct runner token (from GitHub UI, expires ~1hr)
      # Settings → Actions → Runners → New self-hosted runner
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"

      # Method 2: PAT-based auto-registration (recommended for persistent runners)
      # Must be a CLASSIC PAT with admin:org scope.
      # Fine-grained PATs do NOT support self-hosted runner management.
      GITHUB_PAT: "${GITHUB_PAT:-}"

      # Runner scope: 'org' for org-level runner, 'repo' for repo-level
      RUNNER_SCOPE: "${RUNNER_SCOPE:-org}"

      # Target: org name (for org scope) or owner/repo (for repo scope)
      RUNNER_TARGET: "${RUNNER_TARGET:-christmas-island}"

      # --- Runner configuration ---

      # Display name in GitHub (defaults to container hostname)
      RUNNER_NAME: "${RUNNER_NAME:-xmas-runner-local}"

      # Comma-separated labels applied to this runner
      RUNNER_LABELS: "${RUNNER_LABELS:-self-hosted,linux,X64,xmas-isle,xmas-runner}"

      # Runner group (must exist in your org settings)
      RUNNER_GROUP: "${RUNNER_GROUP:-default}"

      # Ephemeral: runner picks up one job then exits (recommended for CI)
      EPHEMERAL: "${EPHEMERAL:-false}"

      # GitHub base URL (change for GitHub Enterprise Server)
      GITHUB_URL: "${GITHUB_URL:-https://github.com}"

    volumes:
      # Mount host Docker socket — enables Docker builds inside workflows
      # The runner uses Docker-outside-of-Docker (not DinD)
      - /var/run/docker.sock:/var/run/docker.sock

      # NOTE: runner-work volume mount is intentionally omitted.
      # On Docker Desktop for Mac, mounting a named volume at _work causes
      # "permission denied" errors because Docker Desktop VM volume ownership
      # doesn't match the runner user inside the container.
      # The runner works fine with ephemeral storage; for persistence, see README.

    restart: unless-stopped
